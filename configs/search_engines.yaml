engines:
  duckduckgo:
    enabled: true
    max_results: 20
    retries: 2
    timeout: 20
    rate_limit_seconds: 1.0
  serpapi:
    enabled: true
    max_results: 20
    api_key_env: SERPAPI_API_KEY
    retries: 2
    timeout: 20
    rate_limit_seconds: 0.5
cache:
  enabled: true
  path: output/cache/search_results.json
  ttl_hours: 168
